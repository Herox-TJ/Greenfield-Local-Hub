{% extends 'base.html' %}
{% block title %}Reset Password – Greenfield Local Hub{% endblock %}

{% block content %}
<div class="auth-bg">
    <div class="auth-card" style="max-width:500px;">
        <div class="auth-logo">
            <div class="auth-logo-icon"><img src="{{ url_for('static', filename='images/icons/leaf.svg') }}" alt="leaf" class="icon-svg"></div>
            <span class="auth-logo-name">Greenfield</span>
            <span class="auth-logo-sub">Local Hub</span>
        </div>

        <h2>Reset Password</h2>
        <p class="auth-sub">Answer your security question</p>

        <form method="POST" action="{{ url_for('reset_security') }}">
            <div class="form-group">
                <label>Security Question</label>
                <input type="text" value="{{ question }}" readonly
                       style="background:var(--bg);cursor:default;">
            </div>
            <div class="form-group">
                <label for="answer">Your Answer</label>
                <input type="text" id="answer" name="answer"
                       placeholder="Enter your answer" required>
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
                <a href="{{ url_for('forgot_password') }}"
                   class="btn-submit"
                   style="background:var(--bg); color:var(--text); border:1px solid var(--border); text-align:center;">
                   <img src="{{ url_for('static', filename='images/icons/arrow-left.svg') }}" alt="arrow left" class="icon-svg"> Back
                </a>
                <button type="submit" class="btn-submit">Continue</button>
            </div>
        </form>

        <p class="auth-footer-note">
            <a href="{{ url_for('login') }}"><img src="{{ url_for('static', filename='images/icons/arrow-left.svg') }}" alt="arrow left" class="icon-svg"> Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
