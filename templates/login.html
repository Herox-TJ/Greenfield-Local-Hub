{% extends 'base.html' %}
{% block title %}Login - Greenfield Local Hub{% endblock %}

{% block content %}
<div class="auth-bg">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon"><img src="{{ url_for('static', filename='images/icons/leaf.svg') }}" alt="leaf" class="icon-svg"></div>
            <span class="auth-logo-name">Greenfield</span>
            <span class="auth-logo-sub">Local Hub</span>
        </div>

        <h2>Welcome Back</h2>
        <p class="auth-sub">Sign in to your account</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="********" required>
            </div>
            <div class="forgot-row">
                <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
            </div>
            <div class="form-group">
                <label for="role">I am a...</label>
                <select id="role" name="role">
                    <option value="customer">Customer</option>
                    <option value="producer">Producer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn-submit"><img src="{{ url_for('static', filename='images/icons/log-in.svg') }}" alt="login" class="icon-svg"> Sign In</button>
        </form>

        <p class="auth-footer-note">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
