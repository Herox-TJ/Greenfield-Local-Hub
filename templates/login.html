{% extends 'base.html' %}
{% block title %}Login – Greenfield Local Hub{% endblock %}

{% block content %}
<div class="auth-bg">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="auth-logo-name">Greenfield Local Hub</span>
        </div>
        <h2>Sign In</h2>
        <p class="auth-sub">Welcome back! Please enter your details.</p>
        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
        <p class="auth-footer-note">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
