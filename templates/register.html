{% extends 'base.html' %}
{% block title %}Create Account - Greenfield Local Hub{% endblock %}

{% block content %}
<div class="auth-bg">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon"><img src="{{ url_for('static', filename='images/icons/leaf.svg') }}" alt="leaf" class="icon-svg"></div>
            <span class="auth-logo-name">Greenfield</span>
            <span class="auth-logo-sub">Local Hub</span>
        </div>

        <h2>Create Account</h2>
        <p class="auth-sub">Join our local food community</p>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-row-2">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name"
                           placeholder="John" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name"
                           placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <div class="form-group">
                <label for="role">I am a...</label>
                <select id="role" name="role">
                    <option value="customer">Customer - Shop for local produce and support your community</option>
                    <option value="producer">Producer - Sell your products to local customers</option>
                </select>
            </div>

            <div class="form-group">
                <label for="security_question">Security Question</label>
                <select id="security_question" name="security_question">
                    <option value="">Choose a Security Question</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first school?">What was the name of your first school?</option>
                    <option value="What is your favourite book?">What is your favourite book?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                </select>
            </div>

            <div class="form-group">
                <label for="security_answer">Your Answer</label>
                <input type="text" id="security_answer" name="security_answer"
                       placeholder="Enter your answer">
                <div class="form-hint">Remember this answer - it's case-insensitive</div>
            </div>

            <button type="submit" class="btn-submit"><img src="{{ url_for('static', filename='images/icons/user.svg') }}" alt="user" class="icon-svg"> Create Account</button>
        </form>

        <p class="auth-footer-note">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
