{% extends 'base.html' %}
{% block title %}Reset Password - Greenfield Local Hub{% endblock %}

{% block content %}
<div class="auth-bg">
    <div class="auth-card" style="max-width:440px;">
        <div class="auth-logo">
            <div class="auth-logo-icon"><img src="{{ url_for('static', filename='images/icons/leaf.svg') }}" alt="leaf" class="icon-svg"></div>
            <span class="auth-logo-name">Greenfield</span>
            <span class="auth-logo-sub">Local Hub</span>
        </div>

        <h2>Reset Password</h2>
        <p class="auth-sub">Enter your email to get started</p>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn-submit">Continue</button>
        </form>

        <p class="auth-footer-note">
            <a href="{{ url_for('login') }}"><img src="{{ url_for('static', filename='images/icons/arrow-left.svg') }}" alt="arrow left" class="icon-svg"> Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
