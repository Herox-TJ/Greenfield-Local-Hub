{% extends 'base.html' %}
{% block title %}Reset Password - Greenfield Local Hub{% endblock %}

{% block content %}
<div class="auth-bg">
    <div class="auth-card" style="max-width:440px;">
        <div class="auth-logo">
            <div class="auth-logo-icon"><img src="{{ url_for('static', filename='images/icons/leaf.svg') }}" alt="leaf" class="icon-svg"></div>
            <span class="auth-logo-name">Greenfield</span>
            <span class="auth-logo-sub">Local Hub</span>
        </div>

        <h2>Reset Password</h2>
        <p class="auth-sub">Create a new password</p>

        <form method="POST" action="{{ url_for('reset_new_password') }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
                <div class="form-hint">Must be at least 8 characters</div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn-submit"><img src="{{ url_for('static', filename='images/icons/lock.svg') }}" alt="lock" class="icon-svg"> Reset Password</button>
        </form>

        <p class="auth-footer-note">
            <a href="{{ url_for('login') }}"><img src="{{ url_for('static', filename='images/icons/arrow-left.svg') }}" alt="arrow left" class="icon-svg"> Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
